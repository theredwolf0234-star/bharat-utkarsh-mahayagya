<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>भारत उत्कर्ष महायज्ञ — पंजीकरण</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--saffron:#DE7C22;--maroon:#7A2418;--maroon-dk:#571707;--cream:#FBF4E5;--paper:#FFFDF8;--gold:#C89A3C;--ink:#3A2415;--muted:#8A6F55;--green:#2F7D4F;--green-bg:#E7F3EA;--red:#B3261E;--red-bg:#FBEAE8;--amber:#B8860B;--amber-bg:#FCF2DC;--line:#E7D9BE}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans Devanagari',sans-serif}h1,h2,h3,.serif{font-family:'Noto Serif Devanagari',serif}button{font-family:inherit;cursor:pointer}.wrap{max-width:900px;margin:auto;padding:0 16px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:600}.btn-primary{background:linear-gradient(135deg,var(--saffron),var(--maroon));color:white;box-shadow:0 4px 14px #7a241840}.btn-outline{background:white;color:var(--maroon);border:2px solid var(--maroon)}.btn-ghost{background:transparent;color:var(--maroon);text-decoration:underline;padding:8px 4px}.btn-block{width:100%}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px #7a24180d}.muted{color:var(--muted);font-size:14px}.field{margin-bottom:16px}.field label{display:block;font-weight:600;margin-bottom:6px}.req{color:var(--red)}.field input,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}.field input:focus,.field select:focus{outline:2px solid var(--saffron)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
nav.top{background:linear-gradient(135deg,var(--saffron),var(--maroon-dk));color:#fff;position:sticky;top:0;z-index:20}nav.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}nav.top .brand{font-weight:700;font-size:17px}nav.top .links a{font-size:14px;margin-left:14px;text-decoration:none;cursor:pointer}.hero{background:radial-gradient(circle at 20% 20%,#E9915A 0,transparent 55%),linear-gradient(135deg,var(--saffron),var(--maroon) 65%,var(--maroon-dk));color:#fff;border-radius:0 0 28px 28px;padding:38px 16px 46px;text-align:center}.hero h1{font-size:clamp(28px,7vw,44px);margin:6px 0 14px}.hero .sub{display:inline-block;background:#ffffff29;border:1px solid #ffffff4d;padding:9px 18px;border-radius:30px;font-size:14px}.hero .kundcount{margin-top:22px;display:inline-flex;gap:10px;align-items:baseline;background:#ffffff1f;padding:10px 22px;border-radius:14px}.hero .kundcount b{font-size:30px}.hero .cta{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}section.sec{padding:34px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:640px){.grid3{grid-template-columns:1fr}}.info-card{text-align:center;padding:18px}.info-card .ic{font-size:28px}.kundlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:12px 0 18px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.dot.a{background:var(--green)}.dot.r{background:var(--amber)}.dot.b{background:var(--red)}.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:360px;overflow-y:auto;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fffaf0}.kcell{aspect-ratio:1;border-radius:8px;border:0;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}.kcell.a{background:var(--green)}.kcell.r{background:var(--amber);color:#3a2b00}.kcell.b{background:var(--red);opacity:.75;cursor:not-allowed}.kcell.sel{outline:3px solid var(--maroon);box-shadow:0 0 0 2px white inset}.steps{display:flex;margin-bottom:22px;font-size:13px;color:var(--muted)}.steps .st{flex:1;text-align:center;padding-bottom:8px;border-bottom:3px solid var(--line);font-weight:600}.steps .st.on{color:var(--maroon);border-color:var(--maroon)}.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}.total{font-size:22px;color:var(--maroon);font-weight:800}.tokenbox{border:3px double var(--gold);border-radius:16px;padding:24px;background:#fffdf6;text-align:center}.tokennum{font-size:26px;letter-spacing:1px;font-weight:800;color:var(--maroon);font-family:monospace;margin:6px 0 16px}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;text-align:left;font-size:14.5px;margin:18px 0}.receipt-grid .k{color:var(--muted)}footer.site{background:var(--maroon-dk);color:#f5e3c9;padding:26px 16px;margin-top:20px;font-size:14px;text-align:center}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:640px){.statgrid{grid-template-columns:repeat(2,1fr)}}.stat{background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:24px;color:var(--maroon)}table.adm{width:100%;border-collapse:collapse;font-size:14px}table.adm th,table.adm td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}.hidden{display:none!important}.msg{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px}.msg.ok{background:var(--green-bg);color:var(--green)}.msg.err{background:var(--red-bg);color:var(--red)}.center{text-align:center}.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--maroon);border-radius:50%;animation:sp .8s linear infinite;margin:20px auto}@keyframes sp{to{transform:rotate(360deg)}}.qr-pay-box{background:#fff;border:2px dashed var(--gold);padding:16px;border-radius:12px;text-align:center;margin:16px 0}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}@media print{nav.top,footer.site,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #999}}
</style>
</head>
<body>
<nav class="top no-print"><div class="wrap"><div class="brand">🪔 <span>भारत उत्कर्ष महायज्ञ</span></div><div class="links"><a onclick="go('home')">मुख्य पृष्ठ</a><a onclick="go('search')">पंजीकरण खोजें</a><a onclick="go('adminGate')">एडमिन</a></div></div></nav>
<div id="app"></div>
<footer class="site no-print"><div>🕉️ भारत उत्कर्ष महायज्ञ — "राष्ट्र की समृद्धि में आपकी समृद्धि"</div><div style="margin-top:6px;color:#e3c99a">सहायता हेतु संपर्क करें: कार्यालय, रामलीला मैदान, महर्षि आश्रम, महर्षि नगर, नोएडा 201304</div></footer>
<script>
const API='/api', TOTAL_KUNDS=108, CFG={feePerPerson:1100,feeCouple:2100};let session={form:null,kund:null,lastReg:null,adminToken:null};let selectedKund=null,registrationsCache=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function api(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||'सर्वर त्रुटि');return d}
function go(v){location.hash=v;render(v);scrollTo(0,0)}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'home'));
async function render(v){v=v||'home';if(v==='home')return renderHome();if(v==='register')return renderRegister();if(v==='payment')return renderPayment();if(v==='confirm')return renderConfirm();if(v==='search')return renderSearch();if(v==='adminGate')return renderAdminGate();if(v==='admin')return session.adminToken?renderAdmin():renderAdminGate();return renderHome()}
async function renderHome(){let s=await api('/stats');app.innerHTML=`<div class="hero"><div class="wrap"><div style="font-size:22px">🌸 जय गुरुदेव 🌸</div><h1>भारत उत्कर्ष महायज्ञ</h1><div class="sub">"राष्ट्र की समृद्धि में आपकी समृद्धि" — 16 से 25 नवम्बर 2026</div><div class="kundcount">🔥 कुल अग्नि कुंड <b>१०८</b></div><div class="cta"><button class="btn btn-primary" onclick="go('register')">पंजीकरण करें</button><button class="btn btn-outline" style="background:transparent;color:#fff;border-color:#fff" onclick="go('search')">अपना पंजीकरण देखें</button></div></div></div><div class="wrap"><section class="sec"><div class="card"><h2 style="margin-top:0">महायज्ञ के विषय में</h2><p>श्री सिद्धेश्वर धाम महाराष्ट्र आश्रम द्वारा आयोजित <b>"भारत उत्कर्ष महायज्ञ"</b> एक दिव्य आध्यात्मिक अनुष्ठान है, जिसमें देश की समृद्धि, शांति एवं सर्वजन कल्याण हेतु १०८ अग्नि कुंडों में सम्पूर्ण विधि-विधान से यज्ञ सम्पन्न किया जाएगा।</p><div class="row2"><div><b>📅 तिथि:</b> 16 से 25 नवम्बर 2026</div><div><b>📍 स्थान:</b> रामलीला मैदान, महर्षि आश्रम, महर्षि नगर, नोएडा 201304</div></div></div></section><section class="sec" style="padding-top:0"><div class="grid3"><div class="card info-card"><div class="ic">🔥</div><h3>${s.totalKunds}</h3><div class="muted">कुल अग्नि कुंड</div></div><div class="card info-card"><div class="ic">🪔</div><h3>${s.booked}</h3><div class="muted">आरक्षित/बुक कुंड</div></div><div class="card info-card"><div class="ic">🌺</div><h3>${s.available}</h3><div class="muted">उपलब्ध कुंड</div></div></div></section><section class="sec" style="padding-top:0"><div class="card center"><h2 style="margin-top:0">पंजीकरण की जानकारी</h2><p class="muted">अपनी पसंदीदा तिथि एवं समय चुनें, यजमान संख्या व अग्नि कुंड आरक्षित करें।</p><button class="btn btn-primary" onclick="go('register')">पंजीकरण करें</button></div></section></div>`}
async function renderRegister(){let ks=await api('/kunds');app.innerHTML=`<div class="wrap sec"><div class="steps"><div class="st on">१. जानकारी</div><div class="st">२. कुंड चयन</div><div class="st">३. भुगतान</div><div class="st">४. टोकन</div></div><div class="card"><h2 style="margin-top:0">यजमान पंजीकरण</h2><div id="regMsg"></div><div class="field"><label>पूरा नाम <span class="req">*</span></label><input id="f_name" placeholder="उदाहरण: राम प्रसाद शर्मा"></div><div class="row2"><div class="field"><label>मोबाइल नंबर <span class="req">*</span></label><input id="f_mobile" maxlength="10" inputmode="numeric" placeholder="10 अंकों का मोबाइल नंबर"></div><div class="field"><label>ईमेल (वैकल्पिक)</label><input id="f_email" type="email" placeholder="you@example.com"></div></div><div class="field"><label>शहर / स्थान <span class="req">*</span></label><input id="f_city" placeholder="उदाहरण: नोएडा"></div><h3>तिथि एवं समय स्लॉट चयन</h3><div class="row2"><div class="field"><label>यज्ञ तिथि</label><select id="f_date">${Array.from({length:10},(_,i)=>`<option>${16+i} नवम्बर 2026</option>`).join('')}</select></div><div class="field"><label>समय स्लॉट</label><select id="f_slot"><option>प्रातः सत्र (08:00 AM - 11:00 AM)</option><option>अपराह्न सत्र (02:00 PM - 05:00 PM)</option><option>सायं सत्र (06:00 PM - 09:00 PM)</option></select></div></div><h3>यज्ञ में सहभागिता</h3><div class="field"><label>सहभागिता प्रकार</label><select id="f_type" onchange="updateFee()"><option value="couple">दंपति (पति-पत्नी - अधिकतम 2)</option><option value="family">परिवार (1 से अधिकतम 6 व्यक्ति)</option><option value="group">अन्य समूह (1 से अधिकतम 10 व्यक्ति)</option></select></div><div class="field"><label>प्रतिभागियों की संख्या</label><input id="f_count" type="number" min="1" max="2" value="1" oninput="updateFee()"><div class="muted" id="limitNote">अनुमत सीमा: 1 से 2 व्यक्ति</div></div><div class="field"><div class="muted">पंजीकरण शुल्क: <b id="feePreview" class="serif" style="color:var(--maroon);font-size:18px">₹1100</b></div></div><h3>अग्नि कुंड चयन (१०८ में से)</h3><div class="kundlegend"><span><span class="dot a"></span> उपलब्ध</span><span><span class="dot r"></span> अस्थायी आरक्षण</span><span><span class="dot b"></span> बुक / संरक्षित</span></div><div class="kgrid" id="kgrid"></div><div class="field" style="margin-top:10px"><b>चयनित कुंड: </b><span id="selKundLabel">कोई नहीं</span></div><button class="btn btn-primary btn-block" onclick="submitRegister()">आगे बढ़ें — भुगतान करें</button></div></div>`;buildKundGrid(ks)}
function updateFee(){let t=f_type.value,c=+f_count.value||1,max=t==='couple'?2:t==='family'?6:10;f_count.max=max;limitNote.textContent=`अनुमत सीमा: 1 से ${max} व्यक्ति`;if(c>max){c=max;f_count.value=c}feePreview.textContent='₹'+((t==='couple'&&c===2)?CFG.feeCouple:c*CFG.feePerPerson)}
function buildKundGrid(ks){kgrid.innerHTML=ks.map(k=>{let cl=k.status==='booked'?'b':k.status==='reserved'?'r':'a';return `<button class="kcell ${cl}" ${k.status!=='available'?'disabled':''} data-n="${k.number}" onclick="selectKund(${k.number})">${String(k.number).padStart(3,'0')}</button>`}).join('')}
function selectKund(n){if(n<=9)return alert('कुंड 1 से 9 संरक्षित हैं। कृपया कुंड 10 या उसके बाद चुनें।');selectedKund=n;document.querySelectorAll('.kcell.sel').forEach(x=>x.classList.remove('sel'));document.querySelector(`[data-n="${n}"]`).classList.add('sel');selKundLabel.textContent='कुंड संख्या '+String(n).padStart(3,'0')}
async function submitRegister(){let name=f_name.value.trim(),mobile=f_mobile.value.trim(),city=f_city.value.trim(),count=+f_count.value||1,type=f_type.value;if(!name||!/^[6-9]\d{9}$/.test(mobile)||!city||!selectedKund)return regMsg.innerHTML='<div class="msg err">कृपया नाम, मान्य 10 अंकों का मोबाइल, शहर और कुंड चुनें।</div>';let max=type==='couple'?2:type==='family'?6:10;if(count>max)return regMsg.innerHTML='<div class="msg err">प्रतिभागियों की संख्या सीमा से अधिक है।</div>';try{let d=await api('/reservations',{method:'POST',body:JSON.stringify({name,mobile,email:f_email.value.trim(),city,date:f_date.value,slot:f_slot.value,type,count,kund:selectedKund})});session.form=d;go('payment')}catch(e){regMsg.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
async function renderPayment(){if(!session.form)return go('register');let f=session.form;let upi=`upi://pay?pa=maharishivedvigyan@sbi&pn=MAHARISHI%20VEDVIGYAN%20SANSTHAN&am=${f.amount}&cu=INR`;app.innerHTML=`<div class="wrap sec"><div class="steps"><div class="st">१. जानकारी</div><div class="st on">२. कुंड चयन</div><div class="st on">३. भुगतान</div><div class="st">४. टोकन</div></div><div class="card"><h2>भुगतान एवं सत्यापन विवरण</h2><div class="summary-row"><span>नाम</span><b>${esc(f.name)}</b></div><div class="summary-row"><span>मोबाइल</span><b>${esc(f.mobile)}</b></div><div class="summary-row"><span>तिथि</span><b>${esc(f.date)}</b></div><div class="summary-row"><span>स्लॉट</span><b>${esc(f.slot)}</b></div><div class="summary-row"><span>कुंड</span><b>${String(f.kund).padStart(3,'0')}</b></div><div class="summary-row"><span>कुल राशि</span><b class="total">₹${f.amount}</b></div><div class="qr-pay-box"><h3>MAHARISHI VEDVIGYAN SANSTHAN</h3><p>Scan & Pay via any UPI App</p><div id="paymentQr" style="display:flex;justify-content:center"></div><div><b>UPI ID:</b> <code>maharishivedvigyan@sbi</code></div></div><div id="payMsg"></div><div class="field"><label>UTR / UPI Transaction ID <span class="req">*</span></label><input id="f_utr" placeholder="12 अंकों का UTR / Transaction No."></div><div class="field"><label>भुगतान स्क्रीनशॉट (वैकल्पिक)</label><input type="file" id="f_ss" accept="image/*"></div><button class="btn btn-primary btn-block" onclick="submitPayment()">भुगतान विवरण जमा करें एवं टोकन प्राप्त करें</button><button class="btn btn-ghost btn-block" onclick="cancelPayment()">रद्द करें</button></div></div>`;new QRCode(paymentQr,{text:upi,width:180,height:180})}
async function cancelPayment(){if(session.form)try{await api('/reservations/'+session.form.reservationId,{method:'DELETE'})}catch{}session.form=null;go('register')}
async function submitPayment(){let utr=f_utr.value.trim();if(!utr)return payMsg.innerHTML='<div class="msg err">कृपया UTR / Transaction ID दर्ज करें।</div>';let btn=document.querySelector('.btn-primary');btn.disabled=true;btn.textContent='जमा किया जा रहा है…';try{let d=await api('/payments',{method:'POST',body:JSON.stringify({reservationId:session.form.reservationId,utr})});session.lastReg=d.regId;session.form=null;go('confirm')}catch(e){btn.disabled=false;payMsg.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
async function renderConfirm(){if(!session.lastReg)return go('search');try{let r=await api('/registrations/'+encodeURIComponent(session.lastReg));app.innerHTML=`<div class="wrap sec"><div class="card center"><div style="font-size:40px">✅</div><h2 style="color:var(--green)">पंजीकरण सफल!</h2><p class="muted">आपका टोकन जनरेट कर दिया गया है।</p></div><div class="card" id="printArea"><div class="center serif" style="font-size:22px;color:var(--maroon);font-weight:700">भारत उत्कर्ष महायज्ञ 2026</div><div class="center muted">रामलीला मैदान, महर्षि नगर, नोएडा</div><div class="tokenbox"><div class="muted">टोकन नंबर</div><div class="tokennum">${esc(r.token)}</div><div id="qrHolder" style="display:flex;justify-content:center"></div><div class="muted">इस टोकन को कार्यक्रम स्थल पर साथ लाएँ।</div></div><div class="receipt-grid"><div><span class="k">पंजीकरण ID:</span> ${esc(r.regId)}</div><div><span class="k">नाम:</span> ${esc(r.name)}</div><div><span class="k">मोबाइल:</span> ${esc(r.mobile)}</div><div><span class="k">यज्ञ तिथि:</span> ${esc(r.date)}</div><div><span class="k">समय स्लॉट:</span> ${esc(r.slot)}</div><div><span class="k">प्रतिभागी:</span> ${r.count}</div><div><span class="k">अग्नि कुंड:</span> ${String(r.kund).padStart(3,'0')}</div><div><span class="k">UTR:</span> ${esc(r.utr)}</div></div></div><div class="no-print" style="margin-top:16px"><button class="btn btn-primary" onclick="print()">🖨️ टोकन प्रिंट करें</button> <button class="btn btn-ghost" onclick="go('home')">मुख्य पृष्ठ</button></div></div>`;new QRCode(qrHolder,{text:r.token+'|'+r.regId,width:128,height:128})}catch(e){app.innerHTML='<div class="wrap sec"><div class="msg err">पंजीकरण नहीं मिला।</div></div>'}}
function print(){window.print()}
function renderSearch(){app.innerHTML=`<div class="wrap sec"><div class="card"><h2>अपना पंजीकरण खोजें</h2><div class="field"><input id="s_query" placeholder="मोबाइल नंबर या BU-MY-2026-00001"></div><button class="btn btn-primary btn-block" onclick="doSearch()">पंजीकरण खोजें</button><div id="s_result" style="margin-top:18px"></div></div></div>`}
async function doSearch(){let q=s_query.value.trim();if(!q)return s_result.innerHTML='<div class="msg err">कृपया मोबाइल या टोकन दर्ज करें।</div>';try{let d=await api('/search?q='+encodeURIComponent(q));session.lastReg=d.regId;s_result.innerHTML='<div class="msg ok">पंजीकरण मिल गया।</div><button class="btn btn-primary btn-block" onclick="go(\\'confirm\\')">टोकन देखें / प्रिंट करें</button>'}catch(e){s_result.innerHTML='<div class="msg err">कोई पंजीकरण नहीं मिला।</div>'}}
function renderAdminGate(){app.innerHTML=`<div class="wrap sec"><div class="card" style="max-width:420px;margin:auto"><h2>एडमिन लॉगिन</h2><div id="admMsg"></div><div class="field"><label>पासवर्ड</label><input id="a_pass" type="password"></div><button class="btn btn-primary btn-block" onclick="adminLogin()">लॉगिन करें</button></div></div>`}
async function adminLogin(){try{let d=await api('/admin/login',{method:'POST',body:JSON.stringify({password:a_pass.value})});session.adminToken=d.token;go('admin')}catch(e){admMsg.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
async function renderAdmin(){try{let d=await api('/admin/dashboard',{headers:{Authorization:'Bearer '+session.adminToken}});app.innerHTML=`<div class="wrap sec"><div style="display:flex;justify-content:space-between;align-items:center"><h2>एडमिन पैनल 2026</h2><button class="btn btn-ghost" onclick="session.adminToken=null;go('home')">लॉगआउट</button></div><div class="statgrid"><div class="stat"><b>108</b>कुल कुण्ड</div><div class="stat"><b>${d.booked}</b>बुक</div><div class="stat"><b>${d.available}</b>उपलब्ध</div><div class="stat"><b>${d.registrations.length}</b>पंजीकरण</div></div><section class="sec"><div class="card"><h3>हाल के पंजीकरण</h3><div style="overflow:auto"><table class="adm"><thead><tr><th>टोकन</th><th>नाम</th><th>मोबाइल</th><th>कुंड</th><th>राशि</th><th>UTR</th><th>स्थिति</th></tr></thead><tbody>${d.registrations.map(r=>`<tr><td>${esc(r.token)}</td><td>${esc(r.name)}</td><td>${esc(r.mobile)}</td><td>${r.kund}</td><td>₹${r.amount}</td><td>${esc(r.utr)}</td><td>${esc(r.paymentStatus)}</td></tr>`).join('')}</tbody></table></div></div></section></div>`}catch(e){session.adminToken=null;go('adminGate')}}
render(location.hash.slice(1)||'home');
</script>
</body>
</html>
